name: Mi Primer Workflow v2 16/08/26

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build
        run: |
          docker build -t ghcr.io/carlosm-27/k8s-demo-v2-160826:${{ github.sha }} .
          docker push ghcr.io/carlosm-27/k8s-demo-v2-160826:${{ github.sha }}

      - name: Actualizar deployment
        run: |
          sed -i "s|IMAGE_TAG|${GITHUB_SHA}|g" deployment.yaml